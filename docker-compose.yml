version: '3.8'

services:
  db:
    image: mariadb:10.2
    container_name: mentoria_spring_security_db
    restart: always
    environment:
      MYSQL_DATABASE: mentoria_spring_security_db
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3334:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mentoria-spring-security-api
    restart: always
    depends_on:
      - db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/mentoria_spring_security_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_LIQUIBASE_ENABLED: true
    ports:
      - "8080:8080"

volumes:
  mariadb_data:
